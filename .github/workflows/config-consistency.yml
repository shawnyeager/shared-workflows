name: Configuration Consistency

on:
  workflow_call:
    inputs:
      theme_module:
        required: false
        type: string
        default: 'github.com/shawnyeager/tangerine-theme'
        description: 'Theme module path to verify'

jobs:
  version-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify Go version consistency
        run: |
          if [ ! -f vercel.json ]; then
            echo "::error::vercel.json is missing; Go version is pinned there after the Netlify cutover"
            exit 1
          fi

          GO_MOD_VERSION=$(grep "^go " go.mod | awk '{print $2}')
          VERCEL_GO_VERSION=$(jq -r '.env.GO_VERSION // empty' vercel.json)
          TARBALL_GO_VERSION=$(jq -r '.buildCommand // empty' vercel.json | grep -oE 'go[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's/^go//')

          echo "Checking Go version alignment..."
          echo "  go.mod: $GO_MOD_VERSION"
          echo "  vercel.json env.GO_VERSION: $VERCEL_GO_VERSION"
          echo "  vercel.json build tarball: $TARBALL_GO_VERSION"

          if [ -z "$VERCEL_GO_VERSION" ]; then
            echo "::error::vercel.json is missing env.GO_VERSION"
            exit 1
          fi

          if [ "$GO_MOD_VERSION" != "$VERCEL_GO_VERSION" ]; then
            echo "::error::Go versions don't match - go.mod: $GO_MOD_VERSION, vercel.json: $VERCEL_GO_VERSION"
            exit 1
          fi

          if [ -n "$TARBALL_GO_VERSION" ] && [ "$GO_MOD_VERSION" != "$TARBALL_GO_VERSION" ]; then
            echo "::error::Go tarball doesn't match go.mod - go.mod: $GO_MOD_VERSION, buildCommand: go$TARBALL_GO_VERSION"
            exit 1
          fi

          echo "Go versions match: $GO_MOD_VERSION"

      - name: Verify theme require statement
        run: |
          THEME="${{ inputs.theme_module }}"
          echo "Checking theme module configuration..."

          if ! grep -q "require $THEME" go.mod; then
            echo ""
            echo "::error::go.mod missing theme require statement for $THEME"
            exit 1
          fi

          THEME_VERSION=$(grep "require $THEME" go.mod | awk '{print $3}')
          echo "Theme require statement found: $THEME_VERSION"
